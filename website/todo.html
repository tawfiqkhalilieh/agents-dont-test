<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager — Todo Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { color: #1a1a1a; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 8px 12px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #eee; }
    .status-banner { padding: 8px 12px; background: #e6f4ea; color: #137333; border-radius: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Task Manager</h1>
    <p role="status" data-testid="status-message" class="status-banner" hidden></p>
    <form id="todo-form">
      <input type="text" id="task-title" name="taskTitle" placeholder="What needs to be done?" required>
      <button type="submit" data-testid="add-task-btn">Add Task</button>
    </form>
    <div>
      <span data-testid="task-count">0 tasks</span>
    </div>
    <ul data-testid="task-list"></ul>
  </main>
  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('task-title');
    const list = document.querySelector('[data-testid="task-list"]');
    const count = document.querySelector('[data-testid="task-count"]');
    const status = document.querySelector('[data-testid="status-message"]');

    function updateCount() {
      const items = list.querySelectorAll('li').length;
      count.textContent = `${items} task${items === 1 ? '' : 's'}`;
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const val = input.value.trim();
      if (!val) return;

      const li = document.createElement('li');
      li.innerHTML = `
        <span class="task-name">${val}</span>
        <button type="button" data-testid="delete-btn" onclick="this.parentElement.remove(); updateCount();">Delete</button>
      `;
      list.appendChild(li);
      updateCount();
      status.textContent = 'Task added successfully';
      status.hidden = false;
      input.value = '';
      history.pushState({}, '', '#tasks-updated');
    });
  </script>
</body>
</html>
